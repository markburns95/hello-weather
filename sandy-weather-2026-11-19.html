<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program Manager — Midvale, UT Weather · Nov 19, 2026</title>
<style>
body{margin:0;background:#008080;font:13px/1.3 Arial,Helvetica,sans-serif;color:#000;min-height:100vh;padding:24px 12px;box-sizing:border-box}
.win{max-width:640px;margin:0 auto;background:#c0c0c0;border:2px solid #000;box-shadow:inset 2px 2px #fff,inset -2px -2px #808080,6px 6px 0 rgba(0,0,0,.4)}
.title{background:#000080;color:#fff;font-weight:bold;padding:3px 6px;display:flex;justify-content:space-between;align-items:center}
.title b{background:#c0c0c0;color:#000;border:1px solid #000;box-shadow:inset 1px 1px #fff,inset -1px -1px #808080;padding:0 6px;font-size:11px}
.menu{padding:3px 8px;border-bottom:1px solid #808080;display:flex;gap:14px}
.body{padding:12px}
.group{background:#fff;border:2px solid #808080;border-right-color:#fff;border-bottom-color:#fff;box-shadow:inset 1px 1px #000;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.icon{background:#c0c0c0;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;padding:8px}
.icon h3{margin:0 0 6px;background:#000080;color:#fff;font-size:12px;padding:1px 4px}
.t{font-size:34px;font-weight:bold;font-family:"Courier New",monospace}
.prog{height:14px;background:#fff;border:2px solid #808080;border-right-color:#fff;border-bottom-color:#fff;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#000080 0 8px,#fff 8px 10px)}
.status{margin-top:10px;border:1px solid #808080;padding:3px 6px;box-shadow:inset 1px 1px #808080}
</style></head><body>
<div class="win">
<div class="title"><span>Program Manager - [WEATHER.GRP]</span><b>▼</b></div>
<div class="menu"><u>F</u>ile <span><u>O</u>ptions</span> <span><u>W</u>indow</span> <span><u>H</u>elp</span></div>
<div class="body">
<p><b>Midvale, UT 84047 — Thursday, Nov 19, 2026 — 5 AM to 10 AM</b></p>
<div class="group" id="grid"></div>
<div class="status" id="msg">Loading WEATHER.EXE… please wait.</div>
</div></div>
<script>
const grid=document.getElementById('grid'),msg=document.getElementById('msg');
for(let h=5;h<=10;h++)grid.insertAdjacentHTML('beforeend',`<div class="icon" id="h${h}"><h3>${h}:00 AM</h3><div class="t">--°F</div><div class="p">Precip: --</div><div class="prog"><i></i></div></div>`);
fetch('https://api.open-meteo.com/v1/forecast?latitude=40.62&longitude=-111.90&hourly=temperature_2m,precipitation_probability,precipitation&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=America%2FDenver&start_date=2026-11-19&end_date=2026-11-19')
.then(r=>r.json()).then(j=>{const d=j.hourly;
for(let h=5;h<=10;h++){const c=document.getElementById('h'+h);
c.querySelector('.t').textContent=Math.round(d.temperature_2m[h])+'°F';
c.querySelector('.p').textContent=`Precip: ${d.precipitation_probability[h]}% · ${d.precipitation[h]}"`;
c.querySelector('.prog i').style.width=d.precipitation_probability[h]+'%'}
msg.textContent='Ready. Data: Open-Meteo.'}).catch(()=>{msg.textContent='General Protection Fault: could not load forecast. Reload to retry.'});
</script></body></html>
