<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEPARTURES — Midvale, UT Weather · Nov 17, 2026</title>
<style>
body{margin:0;background:#15171a;color:#f4c430;font-family:"Courier New",monospace;display:flex;justify-content:center;padding:14px}
.board{width:100%;max-width:820px;background:#0b0c0e;border:6px solid #2a2d33;border-radius:10px;padding:14px;box-shadow:0 10px 40px #000}
h1{margin:0 0 4px;font-size:clamp(18px,4.5vw,30px);letter-spacing:.18em;display:flex;justify-content:space-between;color:#fff}
.sub{color:#8a8f98;font-size:12px;letter-spacing:.12em;margin-bottom:12px}
.row{display:grid;grid-template-columns:1.1fr 2.2fr 1.3fr 1.3fr;gap:6px;margin-bottom:6px;align-items:center}
.hdr .c{color:#8a8f98;font-size:clamp(9px,2.2vw,12px);letter-spacing:.14em}
.flaps{display:flex;gap:3px}
.f{position:relative;background:linear-gradient(#25282e 49%,#050506 50%,#1b1d22 51%);color:#f4c430;width:1.05em;height:1.55em;line-height:1.55em;text-align:center;border-radius:3px;font-size:clamp(14px,3.6vw,26px);font-weight:700;overflow:hidden}
.f.sp{background:transparent}
.f.flip{animation:fl .08s steps(2) 6}
@keyframes fl{50%{transform:scaleY(.15)}}
.gate{color:#fff}
.ok{color:#5be37d}.wait{color:#ff9f1c}
.foot{margin-top:14px;display:flex;justify-content:space-between;color:#8a8f98;font-size:11px;letter-spacing:.1em;flex-wrap:wrap;gap:6px}
.note{margin-top:10px;color:#6b7078;font-size:11px}
</style></head><body>
<div class="board">
<h1><span>✈ DEPARTURES</span><span>MIDVALE · 84047</span></h1>
<div class="sub">TUESDAY 17 NOV 2026 · SALT LAKE VALLEY AIRFIELD · MORNING BANKS 05:00–10:00</div>
<div class="row hdr"><div class="c">TIME</div><div class="c">FLIGHT</div><div class="c">TEMP</div><div class="c">PRECIP</div></div>
<div id="rows"></div>
<div class="foot"><span>● ALL DEPARTURES ON SCHEDULE</span><span>BOARD UPDATES: NEVER</span></div>
<div class="note">Hourly figures are climatological estimates (live weather feed unavailable when this page was generated).</div>
</div>
<script>
var data=[["05:00",31,10,"FROST 0501"],["06:00",30,10,"CHILL 0602"],["07:00",30,15,"DAWN 0703"],["08:00",33,20,"SUN 0804"],["09:00",37,20,"WARM 0905"],["10:00",41,25,"MILD 1006"]];
var rows=document.getElementById('rows');
function flaps(t,cls){var d=document.createElement('div');d.className='flaps '+(cls||'');t.split('').forEach(function(ch){var s=document.createElement('span');s.className='f'+(ch==' '?' sp':'');s.textContent=ch;d.appendChild(s)});return d}
function flip(el,final){var ch='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789°%.: ';var n=0,max=8+Math.random()*10|0;var iv=setInterval(function(){n++;el.textContent=n>=max?final:ch[Math.random()*ch.length|0];if(n>=max)clearInterval(iv)},60)}
data.forEach(function(r,i){
 var row=document.createElement('div');row.className='row';
 var cols=[r[0],r[3],r[1]+'°F',r[2]+'% 0.00"'];
 cols.forEach(function(t,j){var cell=document.createElement('div');var f=flaps(t,j==0?'gate':j==2?'':j==3?(r[2]>=20?'wait':'ok'):'');
  cell.appendChild(f);row.appendChild(cell);
  f.querySelectorAll('.f').forEach(function(el,k){var fin=el.textContent;if(fin!=' '){el.textContent=' ';setTimeout(function(){flip(el,fin)},i*250+j*120+k*40)}})});
 rows.appendChild(row)});
</script>
</body></html>
