<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevator Cab Panel — Midvale, UT · Oct 2, 2026</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:repeating-linear-gradient(90deg,#3b2f26 0 3px,#44372c 3px 6px); font-family:Georgia,'Times New Roman',serif; }
  .cab { width:100%; max-width:420px; padding:22px 20px 26px; border-radius:14px;
    background:linear-gradient(135deg,#d9d6cf,#a9a69f 45%,#cfccc5 55%,#9a978f);
    border:3px solid #6b6860; box-shadow:inset 0 0 18px rgba(255,255,255,.5),0 20px 50px rgba(0,0,0,.6); color:#222; }
  .plate { text-align:center; font-size:.7rem; letter-spacing:.35em; text-transform:uppercase; color:#555; }
  h1 { text-align:center; font-size:1.25rem; letter-spacing:.12em; margin:2px 0 14px; text-transform:uppercase; }
  .display { background:#120707; border:4px solid #55524b; border-radius:6px; padding:12px 16px; margin-bottom:18px;
    display:flex; justify-content:space-between; align-items:center; font-family:'Courier New',monospace; color:#ff3b1f; text-shadow:0 0 8px #ff3b1f; }
  .display .floor { font-size:3.2rem; font-weight:700; line-height:1; }
  .display .info { text-align:right; font-size:.8rem; letter-spacing:.1em; }
  .arrow { font-size:1.4rem; }
  .buttons { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .btn { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:50px/50px; cursor:pointer; border:0; text-align:left;
    background:linear-gradient(#eee,#bbb); box-shadow:0 3px 0 #77746c,0 5px 8px rgba(0,0,0,.35); font:inherit; color:inherit; transition:transform .08s; }
  .btn:active { transform:translateY(3px); box-shadow:0 0 0 #77746c; }
  .ring { flex:0 0 46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1rem; background:radial-gradient(circle at 35% 30%,#fff,#d7d4cc); border:3px solid #8a877f; }
  .btn.lit .ring { background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc83a); border-color:#d79a00; box-shadow:0 0 14px #ffb800; }
  .txt .t { font-size:1.35rem; font-weight:700; }
  .txt .p { font-size:.72rem; color:#444; letter-spacing:.04em; }
  .braille { margin-top:16px; display:flex; justify-content:center; gap:6px; }
  .braille i { width:7px; height:7px; border-radius:50%; background:#6f6c64; box-shadow:inset 0 1px 1px #000; }
  .foot { margin-top:14px; text-align:center; font-size:.68rem; color:#444; line-height:1.5; }
  .foot b { letter-spacing:.15em; }
</style>
</head>
<body>
<main class="cab">
  <div class="plate">Capacity 6 Persons · 900 lbs</div>
  <h1>Midvale, UT · 84047</h1>
  <div class="display" aria-live="polite">
    <div class="floor" id="floor">5</div>
    <div class="info"><span class="arrow">▲</span><br><span id="temp">53°F</span><br><span id="pop">0.00 in · 0%</span></div>
  </div>
  <div class="buttons" id="buttons"></div>
  <div class="braille"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="foot"><b>FRI · OCT 2 · 2026</b><br>Press a floor to ride to that hour (5 AM – 10 AM).<br>Estimated from published forecast; live feed unavailable.</div>
</main>
<script>
  var data = [
    {h:5, label:'5 AM', t:53, p:0}, {h:6, label:'6 AM', t:54, p:0}, {h:7, label:'7 AM', t:58, p:0},
    {h:8, label:'8 AM', t:62, p:0}, {h:9, label:'9 AM', t:66, p:0}, {h:10, label:'10 AM', t:70, p:0}
  ];
  var box = document.getElementById('buttons');
  data.forEach(function (d, i) {
    var b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML = '<span class="ring">' + d.h + '</span><span class="txt"><div class="t">' + d.t + '°F</div><div class="p">' + d.label + ' · ' + d.p + '% precip · ' + d.p.toFixed(2) + ' in</div></span>';
    b.onclick = function () { select(i); };
    box.appendChild(b);
  });
  function select(i) {
    var d = data[i];
    [].forEach.call(box.children, function (c, j) { c.classList.toggle('lit', j === i); });
    document.getElementById('floor').textContent = d.h;
    document.getElementById('temp').textContent = d.t + '°F';
    document.getElementById('pop').textContent = d.p.toFixed(2) + ' in · ' + d.p + '%';
  }
  var n = 0; select(0);
  var ride = setInterval(function () { n++; if (n >= data.length) { clearInterval(ride); return; } select(n); }, 700);
  box.addEventListener('click', function () { clearInterval(ride); });
</script>
</body>
</html>
