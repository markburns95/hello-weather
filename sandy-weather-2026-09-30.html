<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vend-O-Weather — Midvale, UT · Sept 30, 2026</title>
<style>
  :root { --body:#c9332b; --steel:#b9bec4; --glass:#0f1c22; --amber:#ffb238; --led:#ff4a3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:#1b1d21 repeating-linear-gradient(45deg,#1b1d21 0 12px,#202328 12px 24px);
    font-family:'Trebuchet MS',Verdana,sans-serif; display:flex; justify-content:center; padding:16px; }
  .machine { width:100%; max-width:820px; background:linear-gradient(#d8443a,var(--body)); border-radius:18px;
    border:6px solid #8d211b; box-shadow:0 20px 50px #000a; padding:18px; color:#fff; }
  h1 { text-align:center; font-size:1.7rem; letter-spacing:.15em; text-transform:uppercase; text-shadow:0 2px #7a1712; }
  .sub { text-align:center; font-size:.85rem; opacity:.9; margin:4px 0 14px; }
  .main { display:grid; grid-template-columns:1fr 150px; gap:14px; }
  .glass { background:var(--glass); border:5px solid var(--steel); border-radius:8px; padding:12px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    box-shadow:inset 0 0 30px #000, inset 0 0 0 2px #000; }
  .slot { background:linear-gradient(#1e3540,#122229); border:1px solid #2f4b58; border-radius:6px; padding:8px 6px 6px;
    text-align:center; position:relative; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .slot:hover, .slot.sel { box-shadow:0 0 14px var(--amber); transform:translateY(-2px); }
  .slot .code { position:absolute; top:4px; left:6px; font:700 .7rem monospace; color:var(--amber); }
  .can { margin:14px auto 6px; width:58px; height:84px; border-radius:8px 8px 10px 10px;
    background:linear-gradient(90deg,#0004,#fff3 30%,#0003 70%,#0006),var(--c); border:2px solid #0006; position:relative; }
  .can::before { content:''; position:absolute; top:-6px; left:4px; right:4px; height:8px; border-radius:50%; background:var(--steel); }
  .can b { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:1.25rem; text-shadow:0 1px 2px #000; }
  .can small { font-size:.6rem; font-weight:400; }
  .time { font-size:.9rem; font-weight:700; color:#dfe9ee; }
  .drop { font-size:.75rem; color:#8fd3ff; }
  .panel { background:#2a2c31; border:4px solid var(--steel); border-radius:8px; padding:10px; text-align:center; }
  .lcd { background:#180404; color:var(--led); font:700 1.05rem monospace; padding:8px 4px; border-radius:4px;
    border:2px inset #555; min-height:130px; text-shadow:0 0 6px var(--led); text-align:left; white-space:pre-line; }
  .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:8px; }
  .keys button { background:var(--steel); border:2px outset #eee; border-radius:4px; padding:6px 0; font:700 .9rem monospace; cursor:pointer; }
  .keys button:active { border-style:inset; }
  .tray { margin-top:14px; background:#111; border:5px solid var(--steel); border-radius:0 0 30px 30px; padding:10px; font-size:.9rem; color:#ddd; text-align:center; }
  .note { margin-top:10px; font-size:.75rem; text-align:center; opacity:.85; }
  @media (max-width:600px){ .main{grid-template-columns:1fr} .glass{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="machine">
  <h1>Vend-O-Weather</h1>
  <p class="sub">Midvale, UT 84047 · Wednesday, Sept 30, 2026 · 5 AM – 10 AM</p>
  <div class="main">
    <div class="glass" id="glass"></div>
    <div class="panel">
      <div class="lcd" id="lcd">SELECT A SLOT</div>
      <div class="keys" id="keys"></div>
    </div>
  </div>
  <div class="tray" id="tray">▼ Press a slot (or key A1–A6) to dispense an hour ▼</div>
  <p class="note">Values are climatological estimates for late September; a live forecast feed was unavailable when this page was generated.</p>
</div>
<script>
const hours = [
  ["5 AM",46,0.00,5],["6 AM",45,0.00,5],["7 AM",46,0.00,5],
  ["8 AM",50,0.00,5],["9 AM",55,0.00,5],["10 AM",60,0.00,5]
];
const colorFor = t => t<48 ? "#3b7fd6" : t<54 ? "#2fa39a" : "#e0893a";
const glass = document.getElementById("glass"), keys = document.getElementById("keys");
const lcd = document.getElementById("lcd"), tray = document.getElementById("tray");
hours.forEach((h,i)=>{
  const code = "A"+(i+1);
  const s = document.createElement("div");
  s.className="slot"; s.dataset.i=i;
  s.innerHTML = `<span class="code">${code}</span><div class="can" style="--c:${colorFor(h[1])}"><b>${h[1]}°<small>F</small></b></div>
    <div class="time">${h[0]}</div><div class="drop">💧 ${h[2].toFixed(2)} in</div>`;
  s.onclick=()=>pick(i); glass.appendChild(s);
  const k=document.createElement("button"); k.textContent=code; k.onclick=()=>pick(i); keys.appendChild(k);
});
function pick(i){
  const h=hours[i];
  document.querySelectorAll(".slot").forEach(s=>s.classList.toggle("sel",+s.dataset.i===i));
  lcd.textContent=`SLOT A${i+1}\n${h[0]}\nTEMP ${h[1]}°F\nRAIN ${h[2].toFixed(2)}"\nCHANCE ${h[3]}%`;
  tray.textContent=`⬇ CLUNK! One ${h[0]} at ${h[1]}°F, ${h[2]===0?"no precipitation":h[2].toFixed(2)+" in precipitation"}. Enjoy! ⬇`;
}
pick(0);
</script>
</body>
</html>
