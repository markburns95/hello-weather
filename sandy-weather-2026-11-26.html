<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Catalog Drawer — Midvale, UT · Nov 26, 2026</title>
<style>
:root{--wood:#5a3a22;--wood2:#3f2716;--card:#f6efd9;--line:#9db7d3;--red:#b3342b;--ink:#26221c;--brass:#c9a24b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:repeating-linear-gradient(90deg,#4a2f1b 0 3px,#523421 3px 9px);font-family:"Courier New",monospace;color:var(--ink);padding:20px 14px;display:flex;justify-content:center}
.drawer{width:100%;max-width:560px}
.face{background:linear-gradient(var(--wood),var(--wood2));border:3px solid #2a170b;border-radius:8px 8px 0 0;padding:14px;text-align:center;position:relative;box-shadow:0 6px 0 #25140a}
.label{display:inline-block;background:var(--card);border:2px solid var(--brass);padding:6px 14px;font-size:.85rem;letter-spacing:.12em}
.pull{width:90px;height:14px;margin:10px auto 0;border-radius:8px;background:linear-gradient(#e3c36e,var(--brass));box-shadow:inset 0 -3px 0 #8a6a22}
.tray{background:var(--wood2);padding:14px 12px 20px;border:3px solid #2a170b;border-top:0;display:flex;flex-direction:column;gap:-8px}
.card{position:relative;background:var(--card);background-image:linear-gradient(transparent 31px,var(--line) 32px);background-size:100% 32px;border-radius:3px;margin-top:-6px;padding:30px 16px 12px 44px;box-shadow:0 -2px 4px rgba(0,0,0,.35);cursor:pointer;transform-origin:bottom;transition:transform .3s,margin .3s;min-height:128px}
.card:first-child{margin-top:0}
.card::before{content:"";position:absolute;left:14px;bottom:10px;width:12px;height:12px;border-radius:50%;background:var(--wood2);box-shadow:inset 0 2px 3px #000}
.card::after{content:"";position:absolute;left:36px;top:0;bottom:0;width:1px;background:var(--red);opacity:.6}
.tab{position:absolute;top:-14px;right:18px;background:#e8d9a8;border:1px solid #b9a460;border-bottom:0;padding:2px 10px;font-size:.7rem;border-radius:4px 4px 0 0}
.card.open{transform:translateY(-10px)}
.call{font-size:.7rem;color:var(--red);letter-spacing:.1em}
.title{font-size:1.15rem;font-weight:bold;margin:4px 0}
.line{font-size:.9rem;line-height:32px;margin-top:-2px}
.stamp{position:absolute;right:14px;bottom:10px;border:2px solid var(--red);color:var(--red);padding:2px 8px;font-size:.7rem;transform:rotate(-6deg);letter-spacing:.1em}
.foot{color:#d9c9a0;font-size:.75rem;text-align:center;margin-top:14px}
</style></head><body>
<div class="drawer">
<div class="face"><span class="label">WX · MIDVALE UT 84047 · 05:00 – 10:00</span><div class="pull"></div></div>
<div class="tray" id="tray"></div>
<div class="foot" id="st">Retrieving cards… (tap a card to pull it forward)</div>
</div>
<script>
const hours=[5,6,7,8,9,10],tray=document.getElementById('tray'),st=document.getElementById('st');
const lab=h=>(h%12||12)+':00 '+(h<12?'AM':'PM');
const cards=hours.map((h,i)=>{const c=document.createElement('div');c.className='card';
c.innerHTML='<div class="tab">'+String(h).padStart(2,'0')+'</div><div class="call">WX 551.'+(500+h)+' .M53</div><div class="title">'+lab(h)+'</div><div class="line">Temperature: <b class="t">—</b></div><div class="line">Precipitation: <b class="p">—</b></div><div class="stamp">DUE BACK SOON</div>';
c.onclick=()=>c.classList.toggle('open');tray.appendChild(c);return c});
const now=new Date().toLocaleDateString('en-CA',{timeZone:'America/Denver'});
fetch('https://api.open-meteo.com/v1/forecast?latitude=40.62&longitude=-111.90&hourly=temperature_2m,precipitation,precipitation_probability&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=America%2FDenver&start_date='+now+'&end_date='+now)
.then(r=>r.json()).then(j=>{hours.forEach((h,i)=>{const t=Math.round(j.hourly.temperature_2m[h]),pr=j.hourly.precipitation[h],pp=j.hourly.precipitation_probability[h];
cards[i].querySelector('.t').textContent=t+'°F';
cards[i].querySelector('.p').textContent=(pr>0?pr.toFixed(2)+' in':'none')+(pp!=null?' ('+pp+'% chance)':'');
cards[i].querySelector('.stamp').textContent='CHECKED OUT '+now});st.textContent='All cards retrieved · live data from Open-Meteo'})
.catch(()=>{cards.forEach(c=>c.querySelector('.stamp').textContent='CARD MISSING');st.textContent='Catalog unavailable — try again later'});
</script></body></html>
