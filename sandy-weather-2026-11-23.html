<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midvale Weather · Departure Board</title>
<style>
:root{--bg:#0b0d10;--amber:#ffb300;--dim:#7a5a00;--blue:#4fc3f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--amber);font-family:"Courier New",monospace;min-height:100vh;padding:16px}
.board{max-width:760px;margin:0 auto;border:4px solid #222;border-radius:8px;background:#000;box-shadow:0 0 40px #ffb30022}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#111;border-bottom:3px solid #222;flex-wrap:wrap;gap:6px}
h1{margin:0;font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase}
.sub{color:var(--dim);font-size:.8rem}
.row{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;padding:12px 18px;border-bottom:1px dashed #2a2a2a;align-items:center}
.head{color:var(--dim);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase}
.flap{display:inline-flex;gap:3px}
.flap span{background:#1a1a1a;border-top:1px solid #333;border-bottom:2px solid #000;padding:6px 8px;font-size:1.5rem;font-weight:bold;min-width:1.3ch;text-align:center;animation:flip .6s ease-out both;animation-delay:calc(var(--i)*60ms)}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:rotateX(0);opacity:1}}
.rain{color:var(--blue)}
.bar{height:8px;background:#1a1a1a;margin-top:6px}.bar i{display:block;height:100%;background:var(--blue)}
.status{padding:14px 18px;color:var(--dim);font-size:.85rem}
@media(prefers-reduced-motion:reduce){.flap span{animation:none}}
</style></head><body>
<div class="board" role="region" aria-label="Weather departure board">
<header><h1>▶ Departures: 5–10 AM</h1><div class="sub">MIDVALE, UT 84047 · <span id="date">2026-11-23</span></div></header>
<div class="row head"><div>Time</div><div>Temp °F</div><div>Precip</div></div>
<div id="rows"></div>
<div class="status" id="status">Loading live forecast…</div>
</div>
<script>
const DATE="2026-11-23",el=id=>document.getElementById(id);
const flap=s=>'<span class="flap">'+[...String(s)].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')+'</span>';
fetch("https://api.open-meteo.com/v1/forecast?latitude=40.62&longitude=-111.90&hourly=temperature_2m,precipitation,precipitation_probability&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=America%2FDenver&start_date="+DATE+"&end_date="+DATE)
.then(r=>r.json()).then(d=>{
 const h=d.hourly;let out="";
 for(let i=5;i<=10;i++){
  const t=Math.round(h.temperature_2m[i]),p=h.precipitation[i],pr=h.precipitation_probability[i];
  const lab=(i<12?i:i-12)+":00 AM";
  out+=`<div class="row"><div>${lab}</div><div>${flap(t+"°")}</div><div class="rain">${flap(p.toFixed(2)+'"')} <small>${pr}% chance</small><div class="bar"><i style="width:${pr}%"></i></div></div></div>`;
 }
 el("rows").innerHTML=out;el("status").textContent="Live data · Open-Meteo · times Mountain";
}).catch(()=>{el("status").textContent="Board offline: could not load forecast."});
</script></body></html>
