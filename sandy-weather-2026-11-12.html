<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thermal Receipt — Midvale, UT · Nov 12, 2026</title>
<style>
body{margin:0;min-height:100vh;background:#2b2d31;display:flex;justify-content:center;padding:28px 12px;font-family:"Courier New",Courier,monospace;color:#222}
.printer{width:100%;max-width:360px}
.slot{height:14px;background:#111;border-radius:7px;box-shadow:0 4px 10px #000a}
.paper{background:#fbfaf5;margin:0 14px;padding:18px 16px 30px;box-shadow:0 10px 24px #0008;
 clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),95% 100%,90% calc(100% - 10px),85% 100%,80% calc(100% - 10px),75% 100%,70% calc(100% - 10px),65% 100%,60% calc(100% - 10px),55% 100%,50% calc(100% - 10px),45% 100%,40% calc(100% - 10px),35% 100%,30% calc(100% - 10px),25% 100%,20% calc(100% - 10px),15% 100%,10% calc(100% - 10px),5% 100%,0 calc(100% - 10px));
 animation:feed 1.4s steps(14) both}
@keyframes feed{from{transform:translateY(-40px);opacity:.2}to{transform:none;opacity:1}}
h1{margin:0;text-align:center;font-size:20px;letter-spacing:3px}
.c{text-align:center;font-size:12px}
.hr{border-top:2px dashed #222;margin:10px 0}
.row{display:flex;font-size:15px;margin:7px 0;align-items:baseline}
.row .t{width:64px}.row .d{flex:1;border-bottom:1px dotted #555;margin:0 6px}.row .v{text-align:right;white-space:nowrap}
.sub{font-size:12px;color:#555;margin:-3px 0 7px 64px}
.bar{letter-spacing:-1px;font-size:12px}
.barcode{height:44px;margin:14px 0 4px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 9px,#222 9px 12px,transparent 12px 14px)}
#msg{font-size:13px;text-align:center;padding:10px 0}
</style></head><body>
<div class="printer"><div class="slot"></div>
<div class="paper">
<h1>SKY-MART</h1>
<div class="c">MIDVALE, UT 84047</div>
<div class="c">THU NOV 12 2026 · REG #05-10</div>
<div class="hr"></div>
<div class="c">*** MORNING FORECAST RECEIPT ***</div>
<div class="hr"></div>
<div id="lines"><div id="msg">PRINTING…</div></div>
<div class="hr"></div>
<div class="c">TEMP IN °F · PRECIP IN INCHES</div>
<div class="c">NO REFUNDS ON WEATHER</div>
<div class="barcode"></div>
<div class="c">THANK YOU · DRESS ACCORDINGLY</div>
</div></div>
<script>
(function(){
var url="https://api.open-meteo.com/v1/forecast?latitude=40.62&longitude=-111.90&hourly=temperature_2m,precipitation,precipitation_probability&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=America%2FDenver&start_date=2026-11-12&end_date=2026-11-12";
var box=document.getElementById("lines");
function label(h){return (h%12||12)+":00 "+(h<12?"AM":"PM");}
fetch(url).then(function(r){return r.json();}).then(function(j){
 var H=j.hourly,out="";
 for(var h=5;h<=10;h++){
  var t=Math.round(H.temperature_2m[h]),p=H.precipitation[h],pr=H.precipitation_probability[h];
  var n=Math.max(0,Math.min(10,Math.round(pr/10)));
  out+='<div class="row"><span class="t">'+label(h).replace(":00","")+'</span><span class="d"></span><span class="v">TEMP '+t+'°F</span></div>'+
  '<div class="sub">PRECIP '+p.toFixed(2)+'" <span class="bar">['+"#".repeat(n)+".".repeat(10-n)+'] '+pr+'%</span></div>';
 }
 box.innerHTML=out;
}).catch(function(){box.innerHTML='<div id="msg">PAPER JAM — LIVE FORECAST UNAVAILABLE.<br>PLEASE RELOAD.</div>';});
})();
</script>
</body></html>
