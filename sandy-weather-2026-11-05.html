<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 12px;background:radial-gradient(circle at 50% 0,#4a1d5c,#140818 70%);min-height:100vh;font-family:"Trebuchet MS",sans-serif;color:#ffe9b0;display:flex;justify-content:center}

.deck{display:grid;gap:10px}

.t{font-size:2rem;font-weight:700;text-shadow:0 0 10px #ff9a2e}
.p{text-align:right;font-size:.85rem}
.bar{height:6px;width:90px;background:#3b2a1a;border-radius:3px;margin-top:4px;margin-left:auto;overflow:hidden}
.bar i{display:block;height:100%;background:#4fc3f7}
.note{margin-top:16px;padding:10px;border:1px dashed #d9a441;border-radius:8px;font-size:.78rem;text-align:center;background:#0006}
.coin{text-align:center;margin-top:14px;letter-spacing:.3em;font-size:.75rem;opacity:.7}
</style></head><body>
