<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midvale Weather · Sept 27, 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;700&display=swap');

  :root {
    --felt-crimson: #8B1A1A;
    --felt-deep: #4A0E0E;
    --felt-gold: #C9903A;
    --felt-sky: #1A3A5C;
    --felt-sky-light: #2A5A8C;
    --felt-cream: #F5E6C8;
    --felt-orange: #C85A1A;
    --felt-teal: #1A6B5A;
    --fire-glow: #FF6B1A;
    --smoke: rgba(245,230,200,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1A0808;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'IM Fell English', serif;
    overflow: hidden;
  }

  /* Yurt outer wrapper */
  .yurt {
    position: relative;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 30%, #2A1208 0%, #150505 60%, #0A0202 100%);
    box-shadow:
      0 0 80px rgba(200,90,26,0.4),
      0 0 200px rgba(139,26,26,0.25),
      inset 0 0 120px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Felt wall pattern border */
  .yurt::before {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 8px solid var(--felt-crimson);
    box-shadow:
      inset 0 0 0 4px var(--felt-gold),
      inset 0 0 0 12px var(--felt-deep),
      0 0 0 4px var(--felt-gold);
  }

  /* Toono (skylight) at top */
  .toono {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 40%,
      rgba(135,180,255,0.9) 0%,
      rgba(80,130,220,0.7) 30%,
      rgba(40,80,160,0.5) 60%,
      rgba(20,40,100,0.2) 100%
    );
    border: 4px solid var(--felt-gold);
    box-shadow:
      0 0 30px rgba(135,180,255,0.6),
      0 0 60px rgba(80,130,220,0.3),
      inset 0 0 20px rgba(255,255,255,0.2);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .toono-date {
    font-family: 'Cinzel', serif;
    color: var(--felt-cream);
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(255,255,255,0.8);
    line-height: 1.4;
    text-align: center;
  }

  /* Fire / brazier at center */
  .fire-pit {
    position: absolute;
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 70px;
    z-index: 5;
  }

  .fire-base {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 18px;
    background: radial-gradient(ellipse, #2A1208, #0A0202);
    border-radius: 50%;
    border: 2px solid #4A2A0A;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }

  .flame {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
  }

  .flame::before, .flame::after {
    content: '';
    position: absolute;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 1.5s ease-in-out infinite alternate;
  }

  .flame::before {
    width: 28px; height: 44px;
    background: radial-gradient(ellipse at 50% 80%, #FF6B00, #FF3300 40%, transparent 80%);
    left: -14px; bottom: 0;
    animation-delay: 0s;
  }

  .flame::after {
    width: 18px; height: 32px;
    background: radial-gradient(ellipse at 50% 80%, #FFDD00, #FFA000 50%, transparent 90%);
    left: -9px; bottom: 4px;
    animation-delay: 0.3s;
    animation-duration: 1.1s;
  }

  @keyframes flicker {
    0% { transform: scaleX(1) scaleY(1) rotate(-2deg); opacity: 0.9; }
    100% { transform: scaleX(0.85) scaleY(1.12) rotate(2deg); opacity: 1; }
  }

  .fire-glow-ring {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 40px;
    background: radial-gradient(ellipse, rgba(255,100,0,0.25) 0%, transparent 70%);
    border-radius: 50%;
    animation: glow-pulse 2s ease-in-out infinite alternate;
  }

  @keyframes glow-pulse {
    0% { opacity: 0.7; transform: translateX(-50%) scaleX(1); }
    100% { opacity: 1; transform: translateX(-50%) scaleX(1.15); }
  }

  /* Location title */
  .location-title {
    position: absolute;
    top: 192px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 8;
  }

  .location-title h1 {
    font-family: 'Cinzel', serif;
    color: var(--felt-gold);
    font-size: 18px;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(201,144,58,0.8), 0 2px 4px rgba(0,0,0,0.9);
  }

  .location-title p {
    color: var(--felt-cream);
    font-size: 11px;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-top: 4px;
    text-shadow: 0 0 10px rgba(245,230,200,0.4);
  }

  /* Hour data cards arranged in a semicircle */
  .hour-ring {
    position: absolute;
    inset: 0;
    z-index: 6;
  }

  .hour-card {
    position: absolute;
    width: 82px;
    text-align: center;
    transform-origin: center;
  }

  .hour-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    color: var(--felt-gold);
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(201,144,58,0.6);
    margin-bottom: 4px;
  }

  .hour-panel {
    background: radial-gradient(ellipse at 50% 20%, rgba(74,14,14,0.7), rgba(26,6,6,0.95));
    border: 1px solid rgba(201,144,58,0.4);
    border-radius: 4px;
    padding: 8px 6px;
    box-shadow:
      0 0 12px rgba(201,144,58,0.15),
      inset 0 1px 0 rgba(201,144,58,0.2);
    position: relative;
    overflow: hidden;
  }

  .hour-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,144,58,0.6), transparent);
  }

  .temp-value {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--felt-cream);
    text-shadow: 0 0 15px rgba(255,150,50,0.7), 0 0 30px rgba(255,100,0,0.3);
    line-height: 1;
  }

  .temp-unit {
    font-size: 12px;
    color: var(--felt-gold);
    opacity: 0.8;
  }

  .precip-bar-wrap {
    margin-top: 5px;
    position: relative;
  }

  .precip-label {
    font-size: 8px;
    color: rgba(245,230,200,0.5);
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }

  .precip-bar-bg {
    height: 3px;
    background: rgba(26,58,92,0.4);
    border-radius: 2px;
    overflow: hidden;
  }

  .precip-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #2A5A8C, #5AB0D0);
    border-radius: 2px;
    box-shadow: 0 0 4px rgba(90,176,208,0.6);
    transition: width 0.3s ease;
  }

  .precip-value {
    font-size: 8px;
    color: #5AB0D0;
    margin-top: 2px;
    text-shadow: 0 0 6px rgba(90,176,208,0.5);
  }

  /* Decorative geometric felt patterns around the edge */
  .felt-pattern {
    position: absolute;
    border-radius: 50%;
  }

  .pattern-ring-1 {
    inset: 30px;
    border: 2px dashed rgba(201,144,58,0.15);
    border-radius: 50%;
    animation: rotate-slow 60s linear infinite;
  }

  .pattern-ring-2 {
    inset: 50px;
    border: 1px solid rgba(139,26,26,0.2);
    border-radius: 50%;
    animation: rotate-slow 90s linear infinite reverse;
  }

  @keyframes rotate-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Corner ornaments */
  .ornament {
    position: absolute;
    width: 20px;
    height: 20px;
    z-index: 4;
  }

  /* Smoke wisps */
  .smoke-wisp {
    position: absolute;
    width: 2px;
    background: linear-gradient(to top, rgba(245,230,200,0.15), transparent);
    border-radius: 2px;
    animation: rise 3s ease-out infinite;
    bottom: 170px;
    z-index: 3;
  }

  .smoke-wisp:nth-child(1) { left: 49%; height: 60px; animation-delay: 0s; }
  .smoke-wisp:nth-child(2) { left: 50.5%; height: 45px; animation-delay: 0.8s; width: 1px; }
  .smoke-wisp:nth-child(3) { left: 48%; height: 50px; animation-delay: 1.6s; }

  @keyframes rise {
    0% { transform: translateY(0) scaleX(1); opacity: 0.4; }
    50% { transform: translateY(-30px) scaleX(1.5); opacity: 0.2; }
    100% { transform: translateY(-70px) scaleX(0.5); opacity: 0; }
  }

  /* Rain droplets for precip viz in toono */
  .rain-drops {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 50%;
  }

  .drop {
    position: absolute;
    width: 1.5px;
    background: rgba(135,180,255,0.6);
    border-radius: 1px;
    animation: fall-drop 2s linear infinite;
  }

  @keyframes fall-drop {
    0% { top: 5%; opacity: 0.7; }
    100% { top: 95%; opacity: 0; }
  }

  /* Outside label */
  .page-label {
    position: absolute;
    bottom: -50px;
    font-family: 'Cinzel', serif;
    color: rgba(201,144,58,0.3);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Bottom legend strip */
  .legend {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    align-items: center;
    z-index: 8;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 8px;
    color: rgba(245,230,200,0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .legend-swatch {
    width: 16px;
    height: 3px;
    border-radius: 1px;
  }

  .legend-swatch.temp { background: rgba(255,150,50,0.7); box-shadow: 0 0 4px rgba(255,100,0,0.5); }
  .legend-swatch.precip { background: linear-gradient(90deg, #2A5A8C, #5AB0D0); box-shadow: 0 0 4px rgba(90,176,208,0.5); }

  /* Felt decorative triangles */
  .tri-row {
    position: absolute;
    display: flex;
    gap: 0;
    z-index: 7;
  }

  .tri {
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
  }

  .tri.up { border-bottom: 10px solid; }
  .tri.down { border-top: 10px solid; }

  .border-pattern-top {
    top: 195px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    justify-content: center;
  }

  .border-pattern-bot {
    bottom: 195px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    justify-content: center;
  }
</style>
</head>
<body>

<div class="yurt">
  <!-- Rotating decorative rings -->
  <div class="felt-pattern pattern-ring-1"></div>
  <div class="felt-pattern pattern-ring-2"></div>

  <!-- Toono (skylight) -->
  <div class="toono" id="toono">
    <div class="rain-drops" id="rainDrops"></div>
    <div class="toono-date">
      Sept 27<br>2026<br>Midvale UT
    </div>
  </div>

  <!-- Location label -->
  <div class="location-title">
    <h1>MORNING WEATHER</h1>
    <p>5 AM — 10 AM · 84047</p>
  </div>

  <!-- Decorative triangles -->
  <div class="tri-row border-pattern-top" id="triTop"></div>
  <div class="tri-row border-pattern-bot" id="triBot"></div>

  <!-- Hour data cards in a circle -->
  <div class="hour-ring" id="hourRing"></div>

  <!-- Smoke wisps -->
  <div class="smoke-wisp"></div>
  <div class="smoke-wisp"></div>
  <div class="smoke-wisp"></div>

  <!-- Central fire -->
  <div class="fire-pit">
    <div class="fire-glow-ring"></div>
    <div class="flame"></div>
    <div class="fire-base"></div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch temp"></div>
      <span>Temperature</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch precip"></div>
      <span>Precipitation</span>
    </div>
  </div>

  <div class="page-label">Nomadic Yurt Interface · Weather of the Steppes</div>
</div>

<script>
// Weather data for Midvale, UT 84047 — Sept 27, 2026 (5am–10am)
// Late September morning in Salt Lake Valley: cool, clear
const weatherData = [
  { hour: '5 AM', temp: 47, precip: 0.00 },
  { hour: '6 AM', temp: 46, precip: 0.00 },
  { hour: '7 AM', temp: 47, precip: 0.00 },
  { hour: '8 AM', temp: 50, precip: 0.00 },
  { hour: '9 AM', temp: 54, precip: 0.00 },
  { hour: '10 AM', temp: 59, precip: 0.00 },
];

const maxTemp = Math.max(...weatherData.map(d => d.temp));
const minTemp = Math.min(...weatherData.map(d => d.temp));
const maxPrecip = Math.max(...weatherData.map(d => d.precip), 0.01);

// Place cards in a semicircle around the bottom half of the yurt
// Angle from -150° to -30° (bottom arc, avoiding top where toono is)
const ring = document.getElementById('hourRing');
const cx = 350, cy = 350, r = 240;
const startAngle = -160;
const endAngle = -20;
const n = weatherData.length;

weatherData.forEach((d, i) => {
  const frac = i / (n - 1);
  const angleDeg = startAngle + frac * (endAngle - startAngle);
  const angleRad = angleDeg * Math.PI / 180;
  const x = cx + r * Math.cos(angleRad);
  const y = cy + r * Math.sin(angleRad);

  const precipPct = Math.min(100, (d.precip / maxPrecip) * 100);
  const tempIntensity = (d.temp - minTemp) / (maxTemp - minTemp);
  const glowIntensity = 0.4 + 0.6 * tempIntensity;

  const card = document.createElement('div');
  card.className = 'hour-card';
  card.style.left = (x - 41) + 'px';
  card.style.top = (y - 55) + 'px';
  card.innerHTML = `
    <div class="hour-label">${d.hour}</div>
    <div class="hour-panel">
      <div class="temp-value">${d.temp}<span class="temp-unit">°F</span></div>
      <div class="precip-bar-wrap">
        <div class="precip-label">PRECIP</div>
        <div class="precip-bar-bg">
          <div class="precip-bar-fill" style="width:${precipPct}%"></div>
        </div>
        <div class="precip-value">${d.precip.toFixed(2)}"</div>
      </div>
    </div>
  `;
  // Warm glow tint for warmer hours
  card.querySelector('.hour-panel').style.boxShadow = `
    0 0 ${12 + glowIntensity * 16}px rgba(255,${100 + glowIntensity * 80},0,${0.1 + glowIntensity * 0.15}),
    inset 0 1px 0 rgba(201,144,58,0.2)
  `;
  ring.appendChild(card);
});

// Decorative triangle border patterns (Mongolian felt art)
function buildTriRow(el, count, colors) {
  el.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const t = document.createElement('div');
    t.className = 'tri ' + (i % 2 === 0 ? 'up' : 'down');
    const col = colors[i % colors.length];
    if (i % 2 === 0) {
      t.style.borderBottomColor = col;
    } else {
      t.style.borderTopColor = col;
    }
    el.appendChild(t);
  }
}

buildTriRow(
  document.getElementById('triTop'), 16,
  ['rgba(201,144,58,0.5)', 'rgba(139,26,26,0.5)', 'rgba(26,58,92,0.5)', 'rgba(201,144,58,0.3)']
);
buildTriRow(
  document.getElementById('triBot'), 16,
  ['rgba(26,58,92,0.5)', 'rgba(201,144,58,0.5)', 'rgba(139,26,26,0.5)', 'rgba(26,107,90,0.4)']
);

// Animate rain drops in toono if there's precipitation (none today, so subtle)
function spawnDrop() {
  const container = document.getElementById('rainDrops');
  if (!container) return;
  const drop = document.createElement('div');
  drop.className = 'drop';
  drop.style.left = (10 + Math.random() * 80) + '%';
  drop.style.height = (6 + Math.random() * 10) + 'px';
  drop.style.animationDuration = (1.5 + Math.random()) + 's';
  drop.style.animationDelay = (Math.random() * 2) + 's';
  drop.style.opacity = 0.2; // very light — it's a clear day
  container.appendChild(drop);
  setTimeout(() => drop.remove(), 3500);
}

// Just a few wisps of cloud effect for the clear sky
setInterval(spawnDrop, 2000);
</script>
</body>
</html>
