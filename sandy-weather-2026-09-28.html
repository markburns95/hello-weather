<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midvale Weather · 2026-09-28</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #04060a;
    --myc-amber: #e8a020;
    --myc-glow: #ff6b00;
    --myc-dim: #5a3800;
    --myc-cool: #1a8fff;
    --myc-cool-glow: #00c3ff;
    --thread: rgba(232, 160, 32, 0.18);
    --text: #d4b070;
    --sub: #7a5c2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: 'Share Tech Mono', monospace;
    color: var(--text);
    overflow-x: hidden;
    position: relative;
  }

  canvas#spores {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 60px;
  }

  header .loc {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--sub);
    margin-bottom: 8px;
  }

  header h1 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: clamp(24px, 5vw, 42px);
    color: var(--myc-amber);
    text-shadow: 0 0 30px rgba(232, 160, 32, 0.5), 0 0 60px rgba(255, 107, 0, 0.2);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  header .subtitle {
    font-size: 11px;
    color: var(--sub);
    letter-spacing: 4px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .network-container {
    position: relative;
    width: 100%;
  }

  /* SVG thread layer lives behind nodes */
  .thread-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .hours-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    padding: 20px 0;
  }

  @media (max-width: 560px) {
    .hours-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .node {
    position: relative;
    background: radial-gradient(ellipse at 40% 35%, rgba(232,160,32,0.06) 0%, rgba(4,6,10,0.9) 70%);
    border: 1px solid rgba(232, 160, 32, 0.22);
    border-radius: 4px;
    padding: 22px 18px 18px;
    cursor: default;
    transition: border-color 0.3s, box-shadow 0.3s;
    overflow: hidden;
  }

  .node::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 4px;
    background: radial-gradient(circle at 50% 0%, rgba(232,160,32,0.07), transparent 60%);
    pointer-events: none;
  }

  .node:hover {
    border-color: rgba(232,160,32,0.6);
    box-shadow: 0 0 18px rgba(232,160,32,0.14), inset 0 0 12px rgba(232,160,32,0.04);
  }

  .node.has-rain {
    border-color: rgba(26,143,255,0.35);
    background: radial-gradient(ellipse at 40% 35%, rgba(0,195,255,0.05) 0%, rgba(4,6,10,0.9) 70%);
  }

  .node.has-rain::before {
    background: radial-gradient(circle at 50% 0%, rgba(0,195,255,0.07), transparent 60%);
  }

  .node.has-rain:hover {
    border-color: rgba(0,195,255,0.55);
    box-shadow: 0 0 18px rgba(0,195,255,0.12), inset 0 0 12px rgba(0,195,255,0.04);
  }

  .node-hour {
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--sub);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .node-temp {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 44px;
    line-height: 1;
    color: var(--myc-amber);
    text-shadow: 0 0 20px rgba(232,160,32,0.4);
    margin-bottom: 2px;
  }

  .node.has-rain .node-temp {
    color: var(--myc-cool-glow);
    text-shadow: 0 0 20px rgba(0,195,255,0.4);
  }

  .node-unit {
    font-size: 18px;
    font-weight: 300;
    opacity: 0.6;
    vertical-align: super;
    margin-left: 2px;
  }

  .node-precip {
    font-size: 11px;
    color: var(--sub);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .node-precip .drop {
    display: inline-block;
    width: 6px; height: 8px;
    background: var(--myc-cool);
    clip-path: polygon(50% 0%, 100% 60%, 80% 100%, 20% 100%, 0% 60%);
    opacity: 0.7;
  }

  .node-precip.no-rain .drop { opacity: 0.2; }

  .pulse-ring {
    position: absolute;
    top: 12px; right: 12px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--myc-amber);
    box-shadow: 0 0 6px var(--myc-amber);
    animation: pulse 3s ease-in-out infinite;
  }

  .node.has-rain .pulse-ring {
    background: var(--myc-cool-glow);
    box-shadow: 0 0 6px var(--myc-cool-glow);
    animation: pulse-cool 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 6px var(--myc-amber); }
    50% { opacity: 0.4; transform: scale(0.6); box-shadow: 0 0 14px var(--myc-glow); }
  }

  @keyframes pulse-cool {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 6px var(--myc-cool-glow); }
    50% { opacity: 0.4; transform: scale(0.6); box-shadow: 0 0 14px var(--myc-cool-glow); }
  }

  /* Stagger each node's pulse */
  .node:nth-child(1) .pulse-ring { animation-delay: 0s; }
  .node:nth-child(2) .pulse-ring { animation-delay: 0.5s; }
  .node:nth-child(3) .pulse-ring { animation-delay: 1.0s; }
  .node:nth-child(4) .pulse-ring { animation-delay: 1.5s; }
  .node:nth-child(5) .pulse-ring { animation-delay: 2.0s; }
  .node:nth-child(6) .pulse-ring { animation-delay: 2.5s; }

  .hyphae-bar {
    position: relative;
    height: 2px;
    margin: 14px 0 4px;
    background: linear-gradient(90deg, transparent, var(--myc-dim), transparent);
    overflow: visible;
  }

  .hyphae-bar::after {
    content: '';
    position: absolute;
    left: 0; top: -1px;
    height: 4px;
    width: 30%;
    background: linear-gradient(90deg, transparent, var(--myc-amber));
    border-radius: 2px;
    animation: flow 4s linear infinite;
    box-shadow: 0 0 8px var(--myc-amber);
  }

  .node.has-rain .hyphae-bar::after {
    background: linear-gradient(90deg, transparent, var(--myc-cool-glow));
    box-shadow: 0 0 8px var(--myc-cool-glow);
  }

  @keyframes flow {
    0% { left: -30%; }
    100% { left: 130%; }
  }

  .node:nth-child(2) .hyphae-bar::after { animation-delay: -0.7s; }
  .node:nth-child(3) .hyphae-bar::after { animation-delay: -1.4s; }
  .node:nth-child(4) .hyphae-bar::after { animation-delay: -2.1s; }
  .node:nth-child(5) .hyphae-bar::after { animation-delay: -2.8s; }
  .node:nth-child(6) .hyphae-bar::after { animation-delay: -3.5s; }

  footer {
    text-align: center;
    margin-top: 50px;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(90, 56, 0, 0.5);
    text-transform: uppercase;
  }

  footer span { display: block; margin-top: 4px; }
</style>
</head>
<body>

<canvas id="spores"></canvas>

<div class="wrapper">
  <header>
    <div class="loc">Midvale, Utah · 84047</div>
    <h1>Mycelium Weather</h1>
    <div class="subtitle">September 28, 2026 · 5 AM – 10 AM</div>
  </header>

  <div class="network-container">
    <div class="hours-grid" id="grid">

      <div class="node">
        <div class="pulse-ring"></div>
        <div class="node-hour">05:00 AM</div>
        <div class="node-temp">52<span class="node-unit">°F</span></div>
        <div class="hyphae-bar"></div>
        <div class="node-precip no-rain">
          <span class="drop"></span>
          0.00 in
        </div>
      </div>

      <div class="node">
        <div class="pulse-ring"></div>
        <div class="node-hour">06:00 AM</div>
        <div class="node-temp">51<span class="node-unit">°F</span></div>
        <div class="hyphae-bar"></div>
        <div class="node-precip no-rain">
          <span class="drop"></span>
          0.00 in
        </div>
      </div>

      <div class="node">
        <div class="pulse-ring"></div>
        <div class="node-hour">07:00 AM</div>
        <div class="node-temp">53<span class="node-unit">°F</span></div>
        <div class="hyphae-bar"></div>
        <div class="node-precip no-rain">
          <span class="drop"></span>
          0.00 in
        </div>
      </div>

      <div class="node">
        <div class="pulse-ring"></div>
        <div class="node-hour">08:00 AM</div>
        <div class="node-temp">57<span class="node-unit">°F</span></div>
        <div class="hyphae-bar"></div>
        <div class="node-precip no-rain">
          <span class="drop"></span>
          0.00 in
        </div>
      </div>

      <div class="node">
        <div class="pulse-ring"></div>
        <div class="node-hour">09:00 AM</div>
        <div class="node-temp">62<span class="node-unit">°F</span></div>
        <div class="hyphae-bar"></div>
        <div class="node-precip no-rain">
          <span class="drop"></span>
          0.00 in
        </div>
      </div>

      <div class="node">
        <div class="pulse-ring"></div>
        <div class="node-hour">10:00 AM</div>
        <div class="node-temp">67<span class="node-unit">°F</span></div>
        <div class="hyphae-bar"></div>
        <div class="node-precip no-rain">
          <span class="drop"></span>
          0.00 in
        </div>
      </div>

    </div>
  </div>

  <footer>
    Mycelium Intelligence Network
    <span>Nutrient Signal: Atmospheric Thermal Data</span>
  </footer>
</div>

<script>
// Ambient spore canvas — drifting luminescent particles
(function() {
  const canvas = document.getElementById('spores');
  const ctx = canvas.getContext('2d');
  let W, H, particles;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function mkParticle() {
    const cool = Math.random() < 0.15;
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.8 + 0.3,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.18,
      alpha: Math.random() * 0.35 + 0.05,
      da: (Math.random() - 0.5) * 0.004,
      cool
    };
  }

  function init() {
    resize();
    particles = Array.from({ length: 120 }, mkParticle);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Draw faint thread lines between nearby particles
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 120) {
          const opacity = (1 - d / 120) * 0.06;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = a.cool
            ? `rgba(0,195,255,${opacity})`
            : `rgba(232,160,32,${opacity})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    // Draw particles
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      const color = p.cool ? `rgba(0,195,255,${p.alpha})` : `rgba(232,160,32,${p.alpha})`;
      ctx.fillStyle = color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.cool ? 'rgba(0,195,255,0.5)' : 'rgba(255,107,0,0.5)';
      ctx.fill();
      ctx.shadowBlur = 0;

      p.x += p.vx;
      p.y += p.vy;
      p.alpha += p.da;
      if (p.alpha <= 0.02 || p.alpha >= 0.45) p.da *= -1;
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10;
      if (p.y > H + 10) p.y = -10;
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();
</script>
</body>
</html>
